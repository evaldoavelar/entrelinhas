name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Pinned Playwright image (same tag as @playwright/test): screenshots depend on the OS font
    # rendering, so baselines are only valid here and in `npm run e2e` (scripts/e2e/run.sh).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: image matches @playwright/test
        run: |
          test "$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" = "1.64.1"
          node --version
      - run: npm ci
      - name: verify
        env:
          # Diff coverage gate (ADR-10) against the PR base; on push to main the project gate still applies.
          COVERAGE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: npm run verify
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
